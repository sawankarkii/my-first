<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Novell Service login</h1>
    </header>
    <main>
        <form>
            <label for="username">username:</label>
            <input type="text" id="username">
            <br>
            <br>
            <label for="pass">password:</label>
            <input type="password" id="pass">
            <br>
            <br>
            <label for="loc">location:</label>
            <input type="text" id="loc">
            <br>
            <br>
            <label for="option">web server:</label>
            <select  id="option">
                <option value="os">os</option>
                <option value="window">window</option>
                <option value="none of these">none of these</option>
            </select>
            <br>    
            <br>
            <p>please specify your role:</p>
            <label><input type="checkbox" value="cheese" name="check1">cheese</label>
            <label><input type="checkbox" value="onion" name="check1">onion</label>
            <br>
            <br>
            <label><input type="radio" value="op" name="radio1">op</label>
            <label><input type="radio" value="ok" name="radio1">ok</label>
            <br>
            <br>
            <button type="submit">submit</button>
            <button type="reset">reset</button>
        </form>
    </main>
</body>
</html>
